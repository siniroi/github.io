<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
            line-height: 1.6;
        }

        header {
            padding: 24px 8%;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #2563eb;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #333;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 550px;
            color: #555;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h2>My Website</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="mailto:hello@example.com">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero" id="home">
            <h1>Welcome to My Website</h1>

            <p>
                This is my own space on the internet.
                Explore my work, learn more about me,
                and get in touch.
            </p>

            <a href="#about" class="button">Discover More</a>
        </section>

        <section class="hero" id="about">
            <h1>About Me</h1>

            <p>
                Add your story, projects, business,
                or anything else you want to share here.
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
